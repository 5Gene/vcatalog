name: Update Version Catalog

on:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: update-version-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 🐼 Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🛠️ Update version catalog
        run: |
          echo 🐛 如果遇到Error: Could not find or load main class org.gradle.wrapper.GradleWrapperMain
          echo 💊 那么说明是因为gradle目录,gradlew文件没同步到github导致的,检查下是否此目录下有文件没上传
          chmod +x gradlew
          ./gradlew updateVersionCatalog

      - name: Commit catalog changes
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wings.versions.toml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update wings.versions.toml"
          git push
